name: Weekly redemption code

# Polls your Discord channel for the newest redemption code and commits it to
# the site. Nothing runs on anyone's computer - this executes on GitHub's
# own servers. Requires the DISCORD_BOT_TOKEN repo secret (bot must be able
# to read the channel in update_codes.py).

on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC - picks up each weekly code fast
  workflow_dispatch: # manual "Run workflow" button for testing

permissions:
  contents: write

jobs:
  codes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest code from Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python update_codes.py

      - name: Commit and push
        run: |
          git config user.name "guides-bot"
          git config user.email "guides-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: update weekly redemption code"
          git push
